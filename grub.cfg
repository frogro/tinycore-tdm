set timeout=5
set default=0

# Root über Label finden
search --no-floppy --label TINYCORE --set=root

menuentry "TinyCore Linux (Display-Diagnose)" {
    linux  /boot/vmlinuz loglevel=3 kmap=qwertz/de-latin1 waitusb=10 tce=LABEL=TINYCORE
    initrd /boot/corepure64.gz /boot/custom.gz
}

menuentry "TinyCore (Safe Console Mode)" {
    linux  /boot/vmlinuz loglevel=3 kmap=qwertz/de-latin1 waitusb=10 tce=LABEL=TINYCORE text tdm_safe=1
    initrd /boot/corepure64.gz /boot/custom.gz
}
